    <script>
      (function () {
        const path = window.location.pathname.replace(/\/+$/, "") || "/";
        const isMobile = window.matchMedia("(max-width: 768px)").matches;

        const heroImages = [
          {
            routes: ["/"],
            desktop: "/images/jumbotron_bimbel_lps-desktop-optimized.webp",
            mobile: "/images/jumbotron_bimbel_lps-mobile-optimized.webp",
          },
          {
            routes: ["/les-privat-osn-terbaik", "/les-privat-osn-terbaik-di/"],
            desktop: "/images/program/program-LPS-OLIMPIADE.webp",
            mobile:
              "/images/program/program-LPS-OLIMPIADE-mobile-optimized.webp",
          },
          {
            routes: ["/les-privat-utbk-terbaik"],
            desktop: "/images/program/program-LPS-UTBK-SNBT.webp",
            mobile:
              "/images/program/program-LPS-UTBK-SNBT-mobile-optimized.webp",
          },
          {
            routes: ["/les-privat-utbk-terbaik-di/"],
            desktop: "/images/program/program-LPS-UTBK-SNBT.webp",
            mobile:
              "/images/program/program-LPS-UTBK-SNBT-mobile-optimized.webp",
          },

          {
            routes: [
              "/les-privat-tes-kemampuan-akademik",
              "/les-privat-tes-kemampuan-akademik-di/",
            ],
            desktop: "/images/program/program-LPS-TKA-desktop-optimized.webp",
            mobile: "/images/program/program-LPS-TKA-mobile-optimized.webp",
          },

          {
            routes: [
              "/bimbel-persiapan-cpns-terbaik",
              "/bimbel-persiapan-cpns-terbaik-di/",
            ],
            desktop: "/images/program/program-LPS-CPNS-desktop-optimized.webp",
            mobile: "/images/program/program-LPS-CPNS-mobile-optimized.webp",
          },
          {
            routes: [
              "/bimbel-persiapan-masuk-ui-kki-terbaik",
              "/bimbel-persiapan-masuk-ui-kki-terbaik-di/",
            ],
            desktop:
              "/images/program/program-LPS-SIMAK-UI-KKI-desktop-optimized.webp",
            mobile:
              "/images/program/program-LPS-SIMAK-UI-KKI-mobile-optimized.webp",
          },
          {
            routes: [
              "/les-privat-sd-smp-sma-terbaik",
              "/les-privat-sd-smp-sma-terbaik-di/",
            ],
            desktop: "/images/program/program-LPS-SD-desktop-optimized.webp",
            mobile: "/images/program/program-LPS-SD-mobile-optimized.webp",
          },
        ];

        const matched = heroImages.find((item) =>
          item.routes.some((route) => {
            if (route === "/") return path === "/";
            if (route.endsWith("/")) return path.startsWith(route);
            return path === route;
          }),
        );

        if (!matched) return;

        const imageUrl = isMobile ? matched.mobile : matched.desktop;
        if (!imageUrl) return;

        const link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.href = imageUrl;
        link.setAttribute("fetchpriority", "high");
        document.head.appendChild(link);
      })();
    </script>
