server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # ====================================
    # GZIP COMPRESSION
    # ====================================

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;

    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # ====================================
    # STATIC ASSETS - VITE
    # ====================================

    location /assets/ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ====================================
    # IMAGES
    # ====================================

    location /images/ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=604800";
    }

    # ====================================
    # LLMS.TXT
    # ====================================

    location = /llms.txt {
        default_type text/plain;
        try_files $uri =404;

        add_header Cache-Control "public, max-age=86400";
    }

    # ====================================
    # AI CATALOG
    # ====================================

    location = /.well-known/ai-catalog.json {
        default_type application/json;
        try_files $uri =404;

        add_header Cache-Control "no-cache";
    }

    # ====================================
    # INDEX.HTML
    # ====================================

    location = /index.html {
        try_files $uri =404;

        add_header Cache-Control "no-cache";
    }

    # ====================================
    # HOMEPAGE
    # ====================================

    location = / {
        try_files /index.html =404;

        add_header Cache-Control "no-cache";
    }

    # ====================================
    # REACT ROUTER - SPA FALLBACK
    # ====================================

    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache";
    }
}